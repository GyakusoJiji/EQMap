<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EQMap — 地震震源 時系列アニメーション</title>
<style>
  :root{
    --ocean:#070b14;
    --land:#17202f;
    --coast:#3a4a68;
    --grid:#111a27;
    --ink:#e6ecf5;
    --ink-dim:#8595ad;
    --panel:rgba(11,16,26,.86);
    --edge:rgba(120,145,185,.22);
    --accent:#ff7a45;
    --warn:#ffb454;
    --bad:#ff6b6b;
    --ok:#5ad1a0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ocean);
    color:var(--ink);
    font:13px/1.5 "Segoe UI","Yu Gothic UI",Meiryo,system-ui,sans-serif;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #fx{cursor:crosshair}
  #fx.dragging{cursor:grabbing}

  .panel{
    position:fixed;
    background:var(--panel);
    border:1px solid var(--edge);
    border-radius:10px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
  }

  /* ---- 左上: タイトルと統計 ---- */
  #hud{left:14px;top:14px;padding:11px 14px;min-width:224px}
  #hud h1{margin:0 0 8px;font-size:14px;letter-spacing:.06em;font-weight:600}
  #hud h1 small{display:block;font-size:10px;font-weight:400;color:var(--ink-dim);letter-spacing:.02em;margin-top:2px}
  #stats{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:11.5px}
  #stats dt{color:var(--ink-dim);white-space:nowrap}
  #stats dd{margin:0;font-variant-numeric:tabular-nums}

  /* ---- 左下: 凡例 ---- */
  #legend{left:14px;bottom:96px;padding:10px 14px}
  #legend .cap{font-size:10.5px;color:var(--ink-dim);letter-spacing:.06em;margin-bottom:6px}
  #legend .row{display:flex;align-items:flex-end;gap:14px;height:38px}
  #legend .item{display:flex;flex-direction:column;align-items:center;gap:4px}
  #legend .dot{border-radius:50%;background:var(--accent);opacity:.85}
  #legend .lbl{font-size:10px;color:var(--ink-dim);font-variant-numeric:tabular-nums}

  /* ---- 下部: 再生コントロール ---- */
  #controls{left:14px;right:14px;bottom:14px;padding:10px 14px;display:flex;flex-direction:column;gap:9px}
  #timerow{display:flex;align-items:center;gap:12px}
  #play{
    flex:0 0 auto;width:38px;height:38px;border-radius:50%;
    border:1px solid var(--edge);background:rgba(255,122,69,.14);
    color:var(--accent);font-size:15px;cursor:pointer;line-height:1;
  }
  #play:hover{background:rgba(255,122,69,.26)}
  #clock{flex:0 0 auto;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:186px}
  #clock span{color:var(--ink-dim);font-size:11px;margin-left:6px}
  #seek{flex:1 1 auto;min-width:80px}
  #optrow{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim)}
  #optrow label{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .spacer{flex:1 1 auto}

  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:18px}
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(120,145,185,.28)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:-5px;cursor:pointer;border:0}
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(120,145,185,.28)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);cursor:pointer;border:0}

  select,button.btn{
    background:rgba(255,255,255,.05);color:var(--ink);
    border:1px solid var(--edge);border-radius:6px;
    padding:3px 7px;font:inherit;font-size:11.5px;cursor:pointer;
  }
  button.btn:hover,select:hover{background:rgba(255,255,255,.11)}
  button.btn:disabled{opacity:.45;cursor:default}
  option{background:#111826;color:var(--ink)}

  input.datebox{
    background:rgba(255,255,255,.05);color:var(--ink);
    border:1px solid var(--edge);border-radius:6px;
    padding:3px 6px;font:inherit;font-size:11.5px;
    width:6.2em;text-align:center;font-variant-numeric:tabular-nums;
  }
  input.datebox:hover{background:rgba(255,255,255,.11)}
  input.datebox:focus{outline:none;border-color:var(--accent)}
  input.datebox::placeholder{color:var(--ink-dim)}

  /* ---- 上部中央: 状態バナー ---- */
  #banner{
    left:50%;top:14px;transform:translateX(-50%);
    padding:7px 14px;font-size:12px;max-width:min(680px,64vw);
    display:none;align-items:center;gap:9px;
  }
  #banner.show{display:flex}
  #banner .mark{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:var(--ink-dim)}
  #banner.info .mark{background:var(--ok)}
  #banner.warn .mark{background:var(--warn)}
  #banner.bad  .mark{background:var(--bad)}
  #banner .txt{min-width:0}
  #banner code{background:rgba(255,255,255,.09);padding:1px 5px;border-radius:4px;font-size:11px}

  /* ---- ホバー時のツールチップ ---- */
  #tip{
    position:fixed;z-index:9;pointer-events:none;display:none;
    padding:7px 10px;font-size:11.5px;line-height:1.45;white-space:nowrap;
    background:rgba(8,12,20,.94);border:1px solid var(--edge);border-radius:7px;
  }
  #tip.show{display:block}
  #tip b{color:var(--accent);font-weight:600}
  #tip .sub{color:var(--ink-dim);font-variant-numeric:tabular-nums}

  @media (max-width:760px){
    #legend{display:none}
    #hud{min-width:0;font-size:11px}
    #clock{min-width:0;font-size:12px}
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="base"></canvas>
  <canvas id="fx"></canvas>
</div>

<div id="hud" class="panel">
  <h1>EQMap<small>気象庁 震源データ 時系列アニメーション</small></h1>
  <dl id="stats">
    <dt>蓄積</dt><dd id="s-total">—</dd>
    <dt>期間</dt><dd id="s-span">—</dd>
    <dt>表示中</dt><dd id="s-shown">—</dd>
    <dt>データ源</dt><dd id="s-src">—</dd>
    <dt>最終取得</dt><dd id="s-fetch">—</dd>
  </dl>
</div>

<div id="banner" class="panel"><i class="mark"></i><div class="txt"></div></div>

<div id="legend" class="panel">
  <div class="cap">円の大きさ = マグニチュード</div>
  <div class="row" id="legend-row"></div>
</div>

<div id="controls" class="panel">
  <div id="timerow">
    <button id="play" title="再生 / 一時停止">&#9654;</button>
    <div id="clock">—<span>JST</span></div>
    <input id="seek" type="range" min="0" max="2000" value="2000" step="1" title="時刻シーク">
  </div>
  <div id="optrow">
    <label>速度
      <select id="speed">
        <option value="3600000">1時間 / 秒</option>
        <option value="21600000">6時間 / 秒</option>
        <option value="43200000">12時間 / 秒</option>
        <option value="86400000" selected>1日 / 秒</option>
        <option value="259200000">3日 / 秒</option>
      </select>
    </label>
    <label>期間
      <input id="range-from" class="datebox" type="text" inputmode="numeric" maxlength="6" placeholder="YYMMDD" title="再生範囲の開始日 (YYMMDD)">
      〜
      <input id="range-to" class="datebox" type="text" inputmode="numeric" maxlength="6" placeholder="YYMMDD" title="再生範囲の終了日 (YYMMDD)">
    </label>
    <label>規模
      <select id="minmag">
        <option value="0" selected>すべて</option>
        <option value="2">M2.0 以上</option>
        <option value="3">M3.0 以上</option>
        <option value="4">M4.0 以上</option>
        <option value="5">M5.0 以上</option>
        <option value="6">M6.0 以上</option>
      </select>
    </label>
    <label><input id="loop" type="checkbox" checked> ループ</label>
    <span class="spacer"></span>
    <button class="btn" id="btn-home" title="地図の表示範囲をリセット">全体表示</button>
    <button class="btn" id="btn-refresh" title="気象庁から再取得">更新</button>
    <button class="btn" id="btn-export" title="蓄積データを JSON で保存">書き出し</button>
    <button class="btn" id="btn-import" title="書き出した JSON を取り込む">読み込み</button>
    <input id="file" type="file" accept="application/json,.json" hidden>
  </div>
</div>

<div id="tip"></div>

const JMA_LIST_URL = 'https://www.jma.go.jp/bosai/quake/data/list.json';
const EVENTS_KEY = 'eqmap.events.v1';
const META_KEY   = 'eqmap.meta.v1';
const API_KEY    = 'eqmap.api.v1';

/* データ源の決定。
   正となる DB は Linux サーバー上の SQLite で、そこが1日1回 気象庁から取り込む。
   - ページをサーバーから開いた場合  -> 同一オリジンの API（'' = 相対パス）
   - ?api=http://host:8787 を付けた   -> その API を使い、以後も記憶する
   - file:// で直接開いた場合         -> サーバーが無いので気象庁を直接読む（単体モード）
   API === null が単体モード。'' は「同一オリジン」なので null と区別すること。 */
const API = (() => {
  const q = new URLSearchParams(location.search).get('api');
  if(q !== null){
    const v = q.trim().replace(/\/+$/, '');
    if(v) localStorage.setItem(API_KEY, v); else localStorage.removeItem(API_KEY);
    if(v) return v;
  }else{
    const saved = (localStorage.getItem(API_KEY) || '').trim().replace(/\/+$/, '');
    if(saved) return saved;
  }
  return (location.protocol === 'http:' || location.protocol === 'https:') ? '' : null;
})();
const SERVER_MODE = API !== null;

const MAX_EVENTS = 30000;          // localStorage 5MB に対して安全側の上限
const JST = 9 * 3600e3;
const TAU = Math.PI * 2;
const DAY = 86400e3;

// 震源として採用する範囲。遠地地震（インドネシア・南米など）を弾く。

/* ===================================================================
   2. 小物
   =================================================================== */
const $ = (id) => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const round3 = (v) => Math.round(v*1000)/1000;
const easeOut = (t) => 1 - Math.pow(1-t, 3);

/** JST の壁時計として整形する（データが JST 基準なので表示も JST で通す）。 */
function fmtJST(t, withTime){
  if(!isFinite(t)) return '—';
  const s = new Date(t + JST).toISOString();
  return withTime ? s.slice(0,10) + ' ' + s.slice(11,16) : s.slice(0,10);
}

/** t を含む日の JST 0:00 に切り下げる。 */
function jstDayStart(t){
  const s = new Date(t + JST).toISOString();
  return Date.UTC(+s.slice(0,4), +s.slice(5,7) - 1, +s.slice(8,10)) - JST;
}

/** "YYMMDD" → その日の JST 0:00（UTC ms）。不正な入力は null。 */
function parseYYMMDD(str){
  const m = /^(\d{2})(\d{2})(\d{2})$/.exec(String(str || '').trim());
  if(!m) return null;
  const yy = +m[1], mm = +m[2], dd = +m[3];
  if(mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
  const t = Date.UTC(2000 + yy, mm - 1, dd) - JST;
  if(new Date(t + JST).getUTCMonth() !== mm - 1) return null; // 2/30 等を弾く
  return t;
}

/** JST の日付を "YYMMDD" に整形する。 */
function fmtYYMMDD(t){
  const s = new Date(t + JST).toISOString();
  return s.slice(2,4) + s.slice(5,7) + s.slice(8,10);
}

/** 白熱色 → アクセント色のランプ。毎フレームの色補間を避けるため先に作る。 */
const RAMP = (() => {
  const from = [255,241,208], to = [228,72,42], n = 24, out = [];
  for(let i=0;i<n;i++){
    const t = i/(n-1);
    out.push('rgb(' + from.map((c,j)=>Math.round(c+(to[j]-c)*t)).join(',') + ')');
  }
  return out;
})();

/* ===================================================================
   3. 気象庁データの取得と正規化
   =================================================================== */

/**
 * ISO 6709 風の座標を度に直す。
 * 通常は十進度（+32.5）だが、稀に度分（+3237.5 = 32°37.5'）が混ざる。
 * 値域を超えていたら度分とみなして換算する。
 */
function toDegrees(v, limit){
  if(!isFinite(v)) return null;
  if(Math.abs(v) <= limit) return v;
  const sign = v < 0 ? -1 : 1, a = Math.abs(v);
  const deg = Math.trunc(a/100), min = a - deg*100;
  const d = sign * (deg + min/60);
  return Math.abs(d) <= limit ? d : null;
}

/** "+32.5+130.5-10000/" → {lat, lon, depth(km)}。深さは欠けることがある。 */
function parseCod(cod){
  const m = /^([+-][\d.]+)([+-][\d.]+)(?:([+-][\d.]+))?\//.exec(cod);
  if(!m) return null;
  const lat = toDegrees(parseFloat(m[1]), 90);
  const lon = toDegrees(parseFloat(m[2]), 180);
  if(lat === null || lon === null) return null;
  const depth = m[3] === undefined ? null : -parseFloat(m[3]) / 1000;
  return { lat, lon, depth };
}

/**
 * list.json の生レコード列 → イベントタプル列。
 * 同じ eid に複数の報が来るので、cod を持つ報のうち ctt が最大のものを採る。
 * 震度速報は cod が空なのでここで自然に落ちる。
 */
function normalize(raw){
  const best = new Map();
  for(const r of raw){
    if(!r || !r.cod || !r.at) continue;
    const pos = parseCod(r.cod);
    if(!pos) continue;
    const t = Date.parse(r.at);
    if(!isFinite(t)) continue;

    const eid = String(r.eid || r.at);
    const ctt = String(r.ctt || '');
    const prev = best.get(eid);
    if(prev && prev.ctt >= ctt) continue;

    const mag = (r.mag === '' || r.mag == null) ? null : parseFloat(r.mag);
    best.set(eid, { ctt, ev: [
      eid,
      t,
      round3(pos.lat),
      round3(pos.lon),
      pos.depth == null ? null : Math.round(pos.depth*10)/10,
      (mag == null || !isFinite(mag)) ? null : mag,
      (r.maxi === '' || r.maxi == null) ? null : String(r.maxi),
      String(r.anm || '')
    ]});
  }
  const out = [];
  for(const v of best.values()) out.push(v.ev);
  return out;
}

/** 取得失敗は例外にせず null を返す。呼び出し側でバナーを出す。 */
async function fetchLatest(){
  const res = await fetch(JMA_LIST_URL + '?_=' + Date.now(), { cache:'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if(!Array.isArray(json)) throw new Error('予期しない応答形式');
  return json;
}

/* ===================================================================
   3b. サーバー API
   =================================================================== */

/** サーバーの DB から全イベントを取る。応答は [eid,t,lat,lon,depth,mag,maxi,name]。 */
async function serverEvents(){
  const res = await fetch(API + '/api/events', { cache:'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if(!Array.isArray(json.events)) throw new Error('予期しない応答形式');
  return json;
}

/** サーバーに「今すぐ気象庁を見に行け」と頼む。失敗しても読み出しは続ける。 */
async function serverRefresh(){
  const res = await fetch(API + '/api/refresh', { method:'POST' });
  if(res.status === 429) return { status:'throttled' };   // 間隔が短すぎるだけ。正常系
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

/* ===================================================================
   4. ローカル蓄積
      気象庁の一覧は直近30日分しかない。起動のたびにマージして貯めることで
      それより前の期間もアニメーションできるようにする。
   =================================================================== */
const Store = {
  load(){
    try{
      const raw = localStorage.getItem(EVENTS_KEY);
      if(!raw) return [];
      const a = JSON.parse(raw);
      if(!Array.isArray(a)) return [];
      return a.filter(e => Array.isArray(e) && e.length >= 8 && isFinite(e[E_T]))
              .sort((x,y) => x[E_T] - y[E_T]);
    }catch(err){
      console.warn('蓄積データの読み込みに失敗:', err);
      return [];
    }
  },

  /** 既存 + 新着 を eid でマージし、時刻昇順・上限つきで返す。 */
  merge(existing, incoming){
    const map = new Map();
    for(const e of existing) map.set(e[E_ID], e);
    for(const e of incoming) map.set(e[E_ID], e);   // 新しい報で上書き
    const list = [...map.values()].sort((x,y) => x[E_T] - y[E_T]);
    return list.length > MAX_EVENTS ? list.slice(list.length - MAX_EVENTS) : list;
  },

  /** 容量超過時は古い順に 25% 落として書き直す。落とした件数を返す。 */
  save(list){
    let cur = list, dropped = 0;
    for(let i=0;i<8;i++){
      try{
        localStorage.setItem(EVENTS_KEY, JSON.stringify(cur));
        localStorage.setItem(META_KEY, JSON.stringify({
          version:1, lastFetch:Date.now(), count:cur.length
        }));
        return { list:cur, dropped };
      }catch(err){
        if(cur.length < 200) throw err;
        const cut = Math.floor(cur.length * 0.25);
        cur = cur.slice(cut);
        dropped += cut;
      }
    }
    throw new Error('localStorage への保存に失敗しました');
  },

  meta(){
    try{ return JSON.parse(localStorage.getItem(META_KEY)) || {}; }
    catch(err){ return {}; }
  }
};

/* ===================================================================
   5. 投影と地図描画
      正距円筒に cos(基準緯度) の横方向補正をかけただけの簡易投影。
      日本の緯度帯なら形の破綻はない。
   =================================================================== */
const COS0 = Math.cos(37 * Math.PI / 180);

const view = { cx:0, cy:0, zoom:1, k:1 };   // cx,cy は表示中心（度）
let W = 0, H = 0, dpr = 1;

const baseCv = $('base'), baseCtx = baseCv.getContext('2d');
const fxCv   = $('fx'),   fxCtx   = fxCv.getContext('2d');
// 落ち着いたイベントを焼き付けておくオフスクリーン。毎フレーム全件描くのを避ける。
const trailCv = document.createElement('canvas'), trailCtx = trailCv.getContext('2d');

const wx = (lon) => lon * COS0;
const wy = (lat) => -lat;

function project(lon, lat){
  return [
    (wx(lon) - wx(view.cx)) * view.k + W/2,
    (wy(lat) - wy(view.cy)) * view.k + H/2
  ];
}
function unproject(x, y){
  return [
    (x - W/2) / view.k / COS0 + view.cx,
    -((y - H/2) / view.k) + view.cy
  ];
}

function fitScale(){
  const bw = wx(HOME_BBOX.lonMax) - wx(HOME_BBOX.lonMin);
  const bh = wy(HOME_BBOX.latMin) - wy(HOME_BBOX.latMax);
  return Math.min(W/bw, H/bh) * 0.96;
}
function applyZoom(){ view.k = fitScale() * view.zoom; }

function goHome(){
  view.cx = (HOME_BBOX.lonMin + HOME_BBOX.lonMax) / 2;
  view.cy = (HOME_BBOX.latMin + HOME_BBOX.latMax) / 2;
  view.zoom = 1;
  applyZoom();
}

function drawBase(){
  baseCtx.setTransform(dpr,0,0,dpr,0,0);
  baseCtx.fillStyle = getVar('--ocean');
  baseCtx.fillRect(0,0,W,H);

  // 経緯線
  baseCtx.strokeStyle = getVar('--grid');
  baseCtx.lineWidth = 1;
  baseCtx.beginPath();
  for(let lon=100; lon<=170; lon+=5){
    const a = project(lon, 10), b = project(lon, 60);
    baseCtx.moveTo(a[0], a[1]); baseCtx.lineTo(b[0], b[1]);
  }
  for(let lat=10; lat<=60; lat+=5){
    const a = project(100, lat), b = project(170, lat);
    baseCtx.moveTo(a[0], a[1]); baseCtx.lineTo(b[0], b[1]);
  }
  baseCtx.stroke();

  // 陸地。全リングを1本のパスにまとめて even-odd で塗ると湖が穴として抜ける。
  baseCtx.beginPath();
  for(const ring of JAPAN_GEO){
    for(let i=0;i<ring.length;i++){
      const p = project(ring[i][0], ring[i][1]);
      if(i === 0) baseCtx.moveTo(p[0], p[1]); else baseCtx.lineTo(p[0], p[1]);
    }
    baseCtx.closePath();
  }
  baseCtx.fillStyle = getVar('--land');
  baseCtx.fill('evenodd');
  baseCtx.strokeStyle = getVar('--coast');
  baseCtx.lineWidth = 0.9;
  baseCtx.stroke();
}

function getVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ===================================================================
   6. アプリ状態
   =================================================================== */
const app = {
  all: [],          // 蓄積全件（時刻昇順）
  visible: [],      // フィルタ適用後（時刻昇順）
  tMin: 0, tMax: 0,
  simTime: 0,
  playing: false,
  speed: 86400000,  // シミュレーション時間(ms) / 実時間1秒。30日ぶんを約30秒で流す
  loop: true,
  minMag: 0,
  rangeFrom: 0,     // 再生範囲の開始（JST 0:00, UTC ms）。0 は下限なし
  rangeTo: 0,       // 再生範囲の終了（排他的上限, UTC ms）。0 は上限なし
  rangeUserSet: false, // 期間欄をユーザーが編集済みなら、デフォルト値で上書きしない
  trailStart: 0,    // ここより手前は古すぎるので trail から外してある
  trailEnd: 0,      // ここより手前は trail に焼き付け済み
  cursor: 0,        // ここより手前は発生済み
  hover: null,
  seeking: false,
  lastFetch: 0,     // サーバー（またはブラウザ）が最後に気象庁を見に行った時刻
};

const rippleSpan = () => app.speed * RIPPLE_SEC;
const glowSpan   = () => app.speed * GLOW_SEC;

/** マグニチュードから半径(px)。指数的に効かせて M の差が直感に合うようにする。 */
function radiusFor(mag){
  const m = (mag == null || !isFinite(mag)) ? 2.5 : mag;
  return clamp(1.6 * Math.pow(1.45, m - 2), 1.5, 46);
}

function inKeepBox(e){
  return e[E_LON] >= KEEP_BBOX.lonMin && e[E_LON] <= KEEP_BBOX.lonMax
      && e[E_LAT] >= KEEP_BBOX.latMin && e[E_LAT] <= KEEP_BBOX.latMax;
}

/** 期間欄が未編集なら、蓄積データの最新日から RANGE_DEFAULT_DAYS ぶんを既定の再生範囲にする。 */
function applyDefaultRange(){
  if(app.rangeUserSet || !app.all.length) return;
  const latestDayStart = jstDayStart(app.all[app.all.length - 1][E_T]);
  app.rangeFrom = latestDayStart - RANGE_DEFAULT_DAYS * DAY;
  app.rangeTo = latestDayStart + DAY;
  $('range-from').value = fmtYYMMDD(app.rangeFrom);
  $('range-to').value = fmtYYMMDD(latestDayStart);
}

function rebuildVisible(keepTime){
  applyDefaultRange();
  const prev = app.simTime;
  let list = app.all.filter(inKeepBox);
  if(app.minMag > 0) list = list.filter(e => e[E_MAG] != null && e[E_MAG] >= app.minMag);
  if(app.rangeFrom) list = list.filter(e => e[E_T] >= app.rangeFrom);
  if(app.rangeTo)   list = list.filter(e => e[E_T] < app.rangeTo);
  app.visible = list;
  app.tMin = list.length ? list[0][E_T] : Date.now() - 30*DAY;
  app.tMax = list.length ? list[list.length-1][E_T] : Date.now();
  if(app.tMax <= app.tMin) app.tMax = app.tMin + DAY;

  app.simTime = keepTime ? clamp(prev, app.tMin, app.tMax) : app.tMax;
  rebuildTrail();
  updateStats();
  updateClock();
}

/** t 以上の最初の要素の添字。visible は時刻昇順なので二分探索できる。 */
function lowerBound(v, t){
  let lo = 0, hi = v.length;
  while(lo < hi){
    const mid = (lo + hi) >> 1;
    if(v[mid][E_T] < t) lo = mid + 1; else hi = mid;
  }
  return lo;
}

/** 焼き付け済みレイヤを作り直す。投影・速度・フィルタが変わったら必ず呼ぶ。 */
function rebuildTrail(){
  trailCtx.setTransform(1,0,0,1,0,0);
  trailCtx.clearRect(0, 0, trailCv.width, trailCv.height);
  trailCtx.setTransform(dpr,0,0,dpr,0,0);

  const cut = app.simTime - glowSpan();
  const v = app.visible;
  // 表示時刻から TRAIL_SPAN より古い震源は焼き付けない
  let i = lowerBound(v, app.simTime - TRAIL_SPAN);
  app.trailStart = i;
  while(i < v.length && v[i][E_T] <= cut){ stampTrail(v[i]); i++; }
  app.trailEnd = i;
  let c = i;
  while(c < v.length && v[c][E_T] <= app.simTime) c++;
  app.cursor = c;
}

function stampTrail(e){
  const p = project(e[E_LON], e[E_LAT]);
  if(p[0] < -50 || p[1] < -50 || p[0] > W+50 || p[1] > H+50) return;
  const r = radiusFor(e[E_MAG]);
  trailCtx.globalAlpha = TRAIL_A;
  trailCtx.fillStyle = TRAIL_FILL;
  trailCtx.beginPath();
  trailCtx.arc(p[0], p[1], r, 0, TAU);
  trailCtx.fill();
  trailCtx.globalAlpha = 1;
  trailCtx.strokeStyle = TRAIL_EDGE;
  trailCtx.lineWidth = 0.8;
  trailCtx.stroke();
}

/* ===================================================================
   7. 描画ループ
   =================================================================== */
let lastFrame = 0;
let lastTrailRebuild = 0;

function frame(now){
  const dt = lastFrame ? Math.min(now - lastFrame, 250) : 0;
  lastFrame = now;

  if(app.playing && !app.seeking){
    app.simTime += app.speed * (dt / 1000);
    if(app.simTime >= app.tMax){
      if(app.loop){ app.simTime = app.tMin; rebuildTrail(); }
      else { app.simTime = app.tMax; setPlaying(false); }
    }
    advance();
    updateClock();
    $('seek').value = String(Math.round((app.simTime - app.tMin) / (app.tMax - app.tMin) * 2000));
  }

  paint();
  requestAnimationFrame(frame);
}

/** ポインタを進め、余韻が終わったイベントを trail へ移す。 */
function advance(){
  const v = app.visible, n = v.length;

  // 焼き付けた円は個別には消せないので、TRAIL_SPAN を過ぎたものが出たら焼き直す。
  // 毎フレーム焼き直すと密な時期（2011年の余震など）で数千個の描き直しになるため、
  // 実時間で間隔を空ける。最大 TRAIL_REBUILD_MS ぶん消え遅れるが目では追えない。
  if(app.trailStart < app.trailEnd && v[app.trailStart][E_T] < app.simTime - TRAIL_SPAN){
    const now = performance.now();
    if(now - lastTrailRebuild >= TRAIL_REBUILD_MS){
      lastTrailRebuild = now;
      rebuildTrail();   // trailStart / trailEnd / cursor をまとめて張り直す
      return;
    }
  }

  const cut = app.simTime - glowSpan();
  while(app.trailEnd < n && v[app.trailEnd][E_T] <= cut){ stampTrail(v[app.trailEnd]); app.trailEnd++; }
  while(app.cursor < n && v[app.cursor][E_T] <= app.simTime) app.cursor++;
}

function paint(){
  fxCtx.setTransform(1,0,0,1,0,0);
  fxCtx.clearRect(0, 0, fxCv.width, fxCv.height);
  fxCtx.drawImage(trailCv, 0, 0);
  fxCtx.setTransform(dpr,0,0,dpr,0,0);

  const v = app.visible;
  const glow = glowSpan(), ripple = rippleSpan();

  // trailEnd 〜 cursor が「発生済みだが、まだ余韻の最中」のイベント
  for(let i = app.trailEnd; i < app.cursor; i++){
    const e = v[i];
    const p = project(e[E_LON], e[E_LAT]);
    if(p[0] < -60 || p[1] < -60 || p[0] > W+60 || p[1] > H+60) continue;

    const age = app.simTime - e[E_T];
    const t = clamp(age / glow, 0, 1);
    const r = radiusFor(e[E_MAG]);

    // 広がる波紋
    const rt = age / ripple;
    if(rt < 1){
      fxCtx.globalAlpha = (1 - rt) * 0.8;
      fxCtx.strokeStyle = RAMP[4];
      fxCtx.lineWidth = Math.max(1, r * 0.3);
      fxCtx.beginPath();
      fxCtx.arc(p[0], p[1], r * (0.5 + 2.6 * easeOut(rt)), 0, TAU);
      fxCtx.stroke();
    }

    // 余韻を残しながら減衰する本体
    const a = TRAIL_A + (1 - TRAIL_A) * Math.pow(1 - t, 2.2);
    const col = RAMP[Math.min(RAMP.length - 1, Math.round(t * (RAMP.length - 1)))];
    fxCtx.globalAlpha = a * 0.26;
    fxCtx.fillStyle = col;
    fxCtx.beginPath();
    fxCtx.arc(p[0], p[1], r * 2.1, 0, TAU);
    fxCtx.fill();
    fxCtx.globalAlpha = a;
    fxCtx.beginPath();
    fxCtx.arc(p[0], p[1], r, 0, TAU);
    fxCtx.fill();
  }
  fxCtx.globalAlpha = 1;

  if(app.hover) drawHoverRing(app.hover);
}

function drawHoverRing(e){
  const p = project(e[E_LON], e[E_LAT]);
  fxCtx.strokeStyle = '#ffffff';
  fxCtx.lineWidth = 1.4;
  fxCtx.beginPath();
  fxCtx.arc(p[0], p[1], radiusFor(e[E_MAG]) + 5, 0, TAU);
  fxCtx.stroke();
}

/* ===================================================================
   8. 画面まわり
   =================================================================== */
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  for(const cv of [baseCv, fxCv, trailCv]){
    cv.width  = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
  }
  applyZoom();
  drawBase();
  rebuildTrail();
}

function updateStats(){
  $('s-total').textContent = app.all.length.toLocaleString() + ' 件';
  $('s-shown').textContent = app.visible.length.toLocaleString() + ' 件';
  if(app.all.length){
    $('s-span').textContent = fmtJST(app.all[0][E_T]) + ' 〜 ' + fmtJST(app.all[app.all.length-1][E_T]);
  }else{
    $('s-span').textContent = '—';
  }
  const last = app.lastFetch || Store.meta().lastFetch;
  $('s-fetch').textContent = last ? fmtJST(last, true) : '—';
}

/** 左上の「データ源」表示。今どこを見ているのかを常に明示する。 */
function setSource(label, title){
  const el = $('s-src');
  el.textContent = label;
  el.title = title || '';
}

function updateClock(){
  $('clock').innerHTML = fmtJST(app.simTime, true) + '<span>JST</span>';
}

function setPlaying(on){
  app.playing = on;
  $('play').innerHTML = on ? '&#10073;&#10073;' : '&#9654;';
}

function setBanner(text, kind){
  const el = $('banner');
  if(!text){ el.className = 'panel'; return; }
  el.className = 'panel show ' + (kind || 'info');
  el.querySelector('.txt').innerHTML = text;
}

function buildLegend(){
  const row = $('legend-row');
  row.innerHTML = '';
  for(const m of [3,5,7]){
    const r = radiusFor(m);
    const item = document.createElement('div');
    item.className = 'item';
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.width = dot.style.height = (r*2) + 'px';
    const lbl = document.createElement('div');
    lbl.className = 'lbl';
    lbl.textContent = 'M' + m;
    item.append(dot, lbl);
    row.append(item);
  }
}

/* ===================================================================
   9. ヒットテストとツールチップ
   =================================================================== */
function hitTest(mx, my){
  let best = null, bestD = Infinity;
  const v = app.visible;
  for(let i = app.trailStart; i < app.cursor; i++){
    const e = v[i];
    const p = project(e[E_LON], e[E_LAT]);
    const d = Math.hypot(p[0]-mx, p[1]-my);
    const reach = radiusFor(e[E_MAG]) + 4;
    if(d <= reach && d < bestD){ bestD = d; best = e; }
  }
  return best;
}

function showTip(e, mx, my){
  const tip = $('tip');
  const depth = e[E_DEP] == null ? '不明'
              : (e[E_DEP] <= 0 ? 'ごく浅い' : e[E_DEP].toFixed(0) + ' km');
  tip.innerHTML =
    '<b>' + escapeHtml(e[E_NAME] || '震源不明') + '</b><br>' +
    '<span class="sub">' + fmtJST(e[E_T], true) + ' JST</span><br>' +
    '<span class="sub">M ' + (e[E_MAG] == null ? '—' : e[E_MAG].toFixed(1)) +
    ' ／ 深さ ' + depth +
    ' ／ 最大震度 ' + (e[E_INT] || '—') + '</span>';
  tip.classList.add('show');
  const rect = tip.getBoundingClientRect();
  tip.style.left = clamp(mx + 14, 4, W - rect.width - 4) + 'px';
  tip.style.top  = clamp(my + 14, 4, H - rect.height - 4) + 'px';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}

/* ===================================================================
   10. 入力
   =================================================================== */
function wireInput(){
  window.addEventListener('resize', resize);

  $('play').addEventListener('click', () => {
    if(!app.playing && app.simTime >= app.tMax - 1){
      app.simTime = app.tMin;
      rebuildTrail();
      updateClock();
    }
    setPlaying(!app.playing);
  });

  $('seek').addEventListener('input', (ev) => {
    const f = Number(ev.target.value) / 2000;
    app.simTime = app.tMin + (app.tMax - app.tMin) * f;
    rebuildTrail();
    updateClock();
  });

  $('speed').addEventListener('change', (ev) => {
    app.speed = Number(ev.target.value);
    rebuildTrail();   // 余韻の長さが変わるので焼き付け範囲も変わる
  });

  $('range-from').addEventListener('change', (ev) => {
    app.rangeUserSet = true;
    const t = parseYYMMDD(ev.target.value);
    app.rangeFrom = t || 0;
    ev.target.value = t ? fmtYYMMDD(t) : '';
    rebuildVisible(false);
  });

  $('range-to').addEventListener('change', (ev) => {
    app.rangeUserSet = true;
    const t = parseYYMMDD(ev.target.value);
    app.rangeTo = t ? t + DAY : 0;
    ev.target.value = t ? fmtYYMMDD(t) : '';
    rebuildVisible(false);
  });

  $('minmag').addEventListener('change', (ev) => {
    app.minMag = Number(ev.target.value);
    rebuildVisible(true);
  });

  $('loop').addEventListener('change', (ev) => { app.loop = ev.target.checked; });
  $('btn-home').addEventListener('click', () => { goHome(); drawBase(); rebuildTrail(); });
  $('btn-refresh').addEventListener('click', refresh);
  $('btn-export').addEventListener('click', exportJson);
  $('btn-import').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', importJson);

  document.addEventListener('keydown', (ev) => {
    if(ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') return;
    if(ev.code === 'Space'){ ev.preventDefault(); $('play').click(); }
  });

  // ---- ズームとパン ----
  let dragging = false, lastX = 0, lastY = 0, moved = false;

  fxCv.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const before = unproject(ev.clientX, ev.clientY);
    view.zoom = clamp(view.zoom * Math.pow(1.0015, -ev.deltaY), 1, 60);
    applyZoom();
    const after = unproject(ev.clientX, ev.clientY);
    view.cx += before[0] - after[0];   // カーソル下の地点を固定したまま拡大する
    view.cy += before[1] - after[1];
    drawBase();
    rebuildTrail();
  }, { passive:false });

  fxCv.addEventListener('pointerdown', (ev) => {
    dragging = true; moved = false;
    lastX = ev.clientX; lastY = ev.clientY;
    fxCv.classList.add('dragging');
    fxCv.setPointerCapture(ev.pointerId);
  });

  fxCv.addEventListener('pointermove', (ev) => {
    if(dragging){
      const dx = ev.clientX - lastX, dy = ev.clientY - lastY;
      if(Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      lastX = ev.clientX; lastY = ev.clientY;
      view.cx -= dx / view.k / COS0;
      view.cy += dy / view.k;
      drawBase();
      rebuildTrail();
      $('tip').classList.remove('show');
      app.hover = null;
      return;
    }
    const hit = hitTest(ev.clientX, ev.clientY);
    app.hover = hit;
    if(hit) showTip(hit, ev.clientX, ev.clientY);
    else $('tip').classList.remove('show');
  });

  const endDrag = (ev) => {
    if(!dragging) return;
    dragging = false;
    fxCv.classList.remove('dragging');
    try{ fxCv.releasePointerCapture(ev.pointerId); }catch(err){}
  };
  fxCv.addEventListener('pointerup', endDrag);
  fxCv.addEventListener('pointercancel', endDrag);
  fxCv.addEventListener('pointerleave', () => {
    app.hover = null;
    $('tip').classList.remove('show');
  });
}

/* ===================================================================
   11. 書き出し / 読み込み
      localStorage はブラウザのデータ消去で消える。長期蓄積の保険として、
      アーカイブをファイルに出し入れできるようにしておく。
   =================================================================== */
function exportJson(){
  const blob = new Blob([JSON.stringify(app.all)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'eqmap-archive-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  setBanner(app.all.length.toLocaleString() + ' 件を書き出しました。', 'info');
}

function importJson(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const incoming = JSON.parse(reader.result);
      if(!Array.isArray(incoming)) throw new Error('配列ではありません');
      const clean = incoming.filter(e => Array.isArray(e) && e.length >= 8 && isFinite(e[E_T]));
      if(!clean.length) throw new Error('有効なレコードがありません');
      const before = app.all.length;
      commit(Store.merge(app.all, clean));
      setBanner('読み込み完了: ' + (app.all.length - before).toLocaleString() +
                ' 件を追加（合計 ' + app.all.length.toLocaleString() + ' 件）' +
                (SERVER_MODE
                   ? '。※この取り込みはこのブラウザ内だけです。サーバーの DB に入れるには ' +
                     '<code>eqmap.py import ファイル.json</code> を実行してください。'
                   : ''), SERVER_MODE ? 'warn' : 'info');
    }catch(err){
      setBanner('読み込みに失敗しました: ' + escapeHtml(err.message), 'bad');
    }
    ev.target.value = '';
  };
  reader.readAsText(file);
}

/* ===================================================================
   12. 起動シーケンス
   =================================================================== */

/** マージ結果を保存して画面へ反映する。保存に失敗しても表示は続ける。 */
function commit(list){
  let dropped = 0;
  try{
    const res = Store.save(list);
    app.all = res.list;
    dropped = res.dropped;
  }catch(err){
    console.warn('保存に失敗:', err);
    app.all = list;
    setBanner('データは表示できますが localStorage に保存できませんでした。', 'warn');
  }
  rebuildVisible(true);
  return dropped;
}

/** サーバー由来のデータをオフライン用にキャッシュする（上限まで新しい方を残す）。 */
function cacheLocally(list){
  const keep = list.length > MAX_EVENTS ? list.slice(list.length - MAX_EVENTS) : list;
  try{
    Store.save(keep);
  }catch(err){
    console.warn('オフラインキャッシュの保存に失敗:', err);
  }
}

function autoHideBanner(){
  setTimeout(() => { if($('banner').classList.contains('info')) setBanner(''); }, 9000);
}

async function refresh(){
  const btn = $('btn-refresh');
  btn.disabled = true;
  try{
    if(SERVER_MODE) await refreshFromServer();
    else await refreshFromJma();
  }finally{
    btn.disabled = false;
  }
}

/** サーバーモード。正となる DB はサーバー側にあるので、丸ごと取り直す。 */
async function refreshFromServer(){
  const label = API || location.origin;
  setBanner('サーバーに問い合わせています…（' + escapeHtml(label) + '）', 'info');
  let pushed = null;
  try{
    // まずサーバーへ「今すぐ気象庁を見に行け」と頼む。落ちても読み出しは続ける。
    try{ pushed = await serverRefresh(); }
    catch(err){ console.warn('更新トリガに失敗（読み出しは続行）:', err); }

    const json = await serverEvents();
    app.all = json.events.slice().sort((a, b) => a[E_T] - b[E_T]);
    app.lastFetch = json.lastFetch || 0;
    cacheLocally(app.all);
    rebuildVisible(false);
    setSource('サーバー', label);

    const note = pushed && pushed.status === 'ok' && pushed.added
      ? '（今回の問い合わせで新着 ' + pushed.added.toLocaleString() + ' 件）'
      : (pushed && pushed.status === 'throttled' ? '（サーバーは直前に取得済み）' : '');
    setBanner('サーバーから ' + app.all.length.toLocaleString() + ' 件を読み込みました' + note +
              (json.truncated ? ' ※上限で打ち切られています' : '') + '。▶ で再生します。', 'info');
    autoHideBanner();
  }catch(err){
    console.error(err);
    setSource('キャッシュ', 'サーバーに接続できないため localStorage の内容を表示中');
    setBanner('サーバー（' + escapeHtml(label) + '）に接続できません（' + escapeHtml(err.message) + '）。' +
              (app.all.length
                 ? 'オフラインキャッシュ ' + app.all.length.toLocaleString() + ' 件で表示しています。'
                 : '表示できるデータがありません。') +
              ' サーバー側で <code>systemctl status eqmap</code> を確認してください。', 'bad');
  }
}

/** 単体モード（file:// で直接開いた場合）。気象庁を直接読んでブラウザに貯める。 */
async function refreshFromJma(){
  setBanner('気象庁から最新データを取得しています…', 'info');
  try{
    const raw = await fetchLatest();
    const incoming = normalize(raw);
    const before = app.all.length;
    const dropped = commit(Store.merge(app.all, incoming));
    const added = app.all.length - before + dropped;
    app.lastFetch = Date.now();
    setSource('気象庁 直接', '単体モード。サーバーを使うには ?api=http://ホスト:8787 を付けて開く');
    updateStats();
    setBanner(
      '取得完了 — 気象庁の一覧 ' + incoming.length.toLocaleString() + ' 件のうち新着 ' +
      Math.max(0, added).toLocaleString() + ' 件を追加。蓄積 ' +
      app.all.length.toLocaleString() + ' 件' +
      (dropped ? '（上限超過のため古い ' + dropped.toLocaleString() + ' 件を削除）' : '') +
      '。▶ で再生します。', 'info');
    autoHideBanner();
  }catch(err){
    console.error(err);
    setSource('キャッシュ', '気象庁に接続できないため localStorage の内容を表示中');
    const hint = location.protocol === 'file:'
      ? ' ブラウザが file:// からの通信を拒否している可能性があります。フォルダで <code>python -m http.server 8000</code> を実行し <code>http://localhost:8000/</code> を開いてください。'
      : ' ネットワーク接続を確認してください。';
    setBanner('気象庁からの取得に失敗しました（' + escapeHtml(err.message) + '）。' +
              (app.all.length ? '蓄積済みデータで表示しています。' : '') + hint, 'bad');
  }
}

function init(){
  buildLegend();
  wireInput();
  goHome();
  resize();

  // 1. まずキャッシュだけで描く。サーバーやネットワークを待たせない。
  app.all = Store.load();
  app.lastFetch = Store.meta().lastFetch || 0;
  rebuildVisible(false);
  setPlaying(false);
  setSource(SERVER_MODE ? '接続中…' : '気象庁 直接', SERVER_MODE ? (API || location.origin) : '');
  if(app.all.length){
    setBanner('キャッシュから ' + app.all.length.toLocaleString() + ' 件を復元しました。', 'info');
  }

  // 2. 起動時チェック。再生は自動では始めない。
  refresh();

  requestAnimationFrame(frame);
}

init();
</script>
